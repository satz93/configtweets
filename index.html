<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page -->
<title>Said at Config India</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Rubik+Mono+One&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
  /* Layout: one badge centred on a carpet-teal backdrop with a one-line prompt underneath. Scrolling slides the current badge off the top and brings the next one up from below. */
  :root {
    --floor: #7fd0c9;          /* page backdrop, the hall carpet */
    --floor-ink: #0f2e2f;      /* text on the backdrop */
    --floor-soft: #2c5c5c;
    --paper: #fbfbf7;          /* badge card stock */
    --ink: #121417;            /* badge print */
    --ink-soft: #4a4f55;
    --rule: #121417;
    --focus: #45d35c;
    --logo-on-light: block;    /* dark logo on the light backdrop */
    --logo-on-dark: none;
    --shadow: 0 18px 40px rgb(9 40 40 / .28), 0 2px 6px rgb(9 40 40 / .18);
    --stamp-sky: #74b9e2;
    --stamp-coral: #e86a4b;
    --stamp-leaf: #5cb052;
    --stamp-mustard: #f0d35b;
    --stamp-cyan: #45bacf;

    --font-display: "Rubik Mono One", "Arial Black", Impact, sans-serif;
    --font-body: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --card-w: 320px;           /* set from the window size by script */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --floor: #0e3537; --floor-ink: #e4f4f1; --floor-soft: #9cc7c3;
      --paper: #f1f1ec;
      --shadow: 0 18px 44px rgb(0 0 0 / .5), 0 2px 6px rgb(0 0 0 / .35);
      --logo-on-light: none; --logo-on-dark: block;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --floor: #0e3537; --floor-ink: #e4f4f1; --floor-soft: #9cc7c3;
    --paper: #f1f1ec;
    --shadow: 0 18px 44px rgb(0 0 0 / .5), 0 2px 6px rgb(0 0 0 / .35);
    --logo-on-light: none; --logo-on-dark: block;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 10%, rgb(255 255 255 / .08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgb(0 0 0 / .08), transparent 45%),
      var(--floor);
    color: var(--floor-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .bar-inner {
    padding-block: 18px 6px;
    padding-left: max(clamp(16px, 2.5vw, 32px), env(safe-area-inset-left, 0px));
    padding-right: max(clamp(16px, 2.5vw, 32px), env(safe-area-inset-right, 0px));
    display: grid;
    gap: 8px;
  }
  .bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; line-height: 0; }
  h1 img { width: auto; height: 22px; max-width: 100%; }
  h1 .logo-light { display: var(--logo-on-light); }
  h1 .logo-dark { display: var(--logo-on-dark); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .credit {
    margin: 0;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    font: 400 12px/1.3 var(--font-mono);
    color: var(--floor-soft);
  }
  /* ---------- stage ---------- */
  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    touch-action: none;
    outline: none;
  }
  .slot {
    position: absolute;
    top: 0;
    left: 50%;
    width: var(--card-w);
    transition: transform .7s cubic-bezier(.2, .8, .2, 1), opacity .45s ease;
  }
  .prompt {
    position: absolute;
    left: 0; right: 0;
    bottom: max(22px, env(safe-area-inset-bottom, 0px));
    margin: 0;
    text-align: center;
    font: 400 14px/1.3 var(--font-body);
    color: var(--floor-ink);
    z-index: 100;
    pointer-events: none;
  }
  .stage.still .slot { transition: none; }

  /* ---------- badge ---------- */
  .badge {
    position: relative;
    aspect-ratio: 1 / 1.58;
    max-width: 100%;
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 34px 20px 18px;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    gap: 12px;
    will-change: transform;
  }
  /* light that follows the pointer while the badge tilts */
  .badge::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgb(255 255 255 / .45), rgb(255 255 255 / 0) 55%);
    mix-blend-mode: soft-light;
    opacity: var(--glare, 0);
  }
  @media (prefers-reduced-motion: reduce) {
    .slot { transition: opacity .2s ease; }
  }

  .holes { position: absolute; top: 11px; left: 0; right: 0; display: flex; justify-content: center; gap: 64px; }
  .holes span {
    position: relative;
    width: 34px; height: 9px;
    border-radius: 6px;
    background: var(--floor);
    box-shadow: inset 0 1px 2px rgb(0 0 0 / .25);
  }
  .head { display: grid; gap: 4px; }
  .mark {
    font: 400 clamp(25px, 8.4vw, 33px)/.9 var(--font-display);
    letter-spacing: -.01em;
  }
  .mark img { display: block; width: 68%; height: auto; }
  .labels {
    display: flex; justify-content: space-between; gap: 8px;
    font: 500 12px/1.2 var(--font-body);
  }

  .panel {
    position: relative;
    min-height: 0;
    background: var(--accent);
    border-radius: 4px;
    padding: 34px 16px 16px;
    overflow: auto;
    scrollbar-width: thin;
  }
  .panel::before {
    content: "\201C";
    position: absolute;
    top: 2px; left: 12px;
    font: 400 46px/1 var(--font-display);
    color: var(--ink);
  }
  .quote {
    margin: 0;
    font-family: var(--font-body);
    font-weight: 500;
    letter-spacing: -.01em;
    line-height: 1.28;
    text-wrap: pretty;
    overflow-wrap: anywhere;
  }
  .quote.s1 { font-size: 23px; }
  .quote.s2 { font-size: 19px; }
  .quote.s3 { font-size: 16.5px; }
  .quote.s4 { font-size: 14.5px; line-height: 1.35; }

  .rule { height: 1px; background: var(--rule); }

  .foot { display: grid; gap: 4px; min-height: 0; }
  .line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .line .handle { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name {
    margin: 0 0 4px;
    font: 500 clamp(21px, 6.4vw, 26px)/1.05 var(--font-body);
    letter-spacing: -.02em;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  .name.long { font-size: clamp(18px, 5.4vw, 21px); }
  .name.longer { font-size: clamp(16px, 4.6vw, 18px); line-height: 1.12; }
  .meta {
    margin: 0;
    font: 400 12.5px/1.25 var(--font-body);
    color: var(--ink-soft);
    overflow-wrap: anywhere;
  }
  .meta.handle { color: var(--ink); }

  .xlink { flex: none; color: var(--ink); text-decoration: none; }
  .xlink:hover { text-decoration: underline; }
  .xlink:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }

  .empty { text-align: center; padding: 80px 16px; font-size: 16px; }
  .empty code { font-family: var(--font-mono); }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <div class="bar-row">
      <h1><img class="logo-light" src="logo.svg" alt="Config" width="705" height="140"><img class="logo-dark" src="logo-white.svg" alt="Config" width="705" height="140"><span class="sr-only">Said at Config India</span></h1>
    </div>
    <p class="credit">Community collection · not made by Figma</p>
  </div>
</header>

<main class="stage" id="stage" tabindex="-1" aria-roledescription="carousel" aria-label="Posts about Config India">
  <p class="prompt" id="hint">Scroll up to see more</p>
</main>

<script src="tweets.js"></script>
<script>
(() => {
  const posts = Array.isArray(window.TWEETS) ? window.TWEETS : [];
  const accents = ["--stamp-sky", "--stamp-coral", "--stamp-leaf", "--stamp-mustard", "--stamp-cyan"];
  const stage = document.getElementById("stage");
  const hintEl = document.getElementById("hint");

  if (!posts.length) {
    stage.innerHTML = '<p class="empty">No posts yet. Add them to <code>tweets.js</code>.</p>';
    return;
  }

  const sizeClass = text => {
    const n = text.length;
    return n <= 110 ? "s1" : n <= 180 ? "s2" : n <= 260 ? "s3" : "s4";
  };
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };

  function buildBadge(post, i) {
    const slot = el("div", "slot");
    slot.dataset.index = i;
    slot.setAttribute("role", "group");
    slot.setAttribute("aria-roledescription", "slide");
    slot.setAttribute("aria-label", `${i + 1} of ${posts.length}`);

    const badge = el("article", "badge");
    badge.style.setProperty("--accent", `var(${accents[i % accents.length]})`);

    const holes = el("div", "holes");
    holes.append(el("span"), el("span"));

    const head = el("div", "head");
    const labels = el("div", "labels");
    labels.append(el("span", null, "India"));
    const mark = el("div", "mark");
    const logo = el("img");
    logo.src = "logo.svg";
    logo.alt = "Config";
    logo.addEventListener("error", () => { mark.textContent = "CONFIG"; });
    mark.append(logo);
    head.append(mark, labels);

    const text = String(post.text || "");
    const panel = el("div", "panel");
    const quote = el("p", `quote ${sizeClass(text)}`, text);
    panel.append(quote);

    const foot = el("div", "foot");
    const fullName = String(post.name || post.handle || "Unknown");
    const nameEl = el("p", "name", fullName);
    if (fullName.length > 28) nameEl.classList.add("longer");
    else if (fullName.length > 18) nameEl.classList.add("long");
    nameEl.title = fullName;
    foot.append(nameEl);
    const line = el("div", "line");
    const handle = post.handle ? "@" + String(post.handle).replace(/^@/, "") : "";
    const handleEl = el("span", "meta handle", handle);
    handleEl.title = handle;
    line.append(handleEl);
    if (post.url) {
      const link = el("a", "meta xlink", "View on X");
      link.href = post.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.setAttribute("aria-label", `Open ${post.name || "this"} post on X`);
      line.append(link);
    }
    foot.append(line);

    badge.append(holes, head, panel, el("div", "rule"), foot);
    slot.append(badge);
    return slot;
  }

  const slots = posts.map(buildBadge);
  stage.append(...slots);

  // Tilt the current badge toward the pointer, easing in and out (mouse and trackpad only).
  const tilt = (() => {
    const enabled = matchMedia("(hover: hover) and (pointer: fine)").matches
      && !matchMedia("(prefers-reduced-motion: reduce)").matches;
    const rest = { rx: 0, ry: 0, lift: 0, glare: 0, gx: 50, gy: 50 };
    let target = { ...rest }, now = { ...rest }, badge = null, frame = 0;

    const paint = () => {
      if (!badge) return;
      badge.style.transform =
        `perspective(900px) rotateX(${now.rx}deg) rotateY(${now.ry}deg) scale(${1 + now.lift * 0.03})`;
      badge.style.setProperty("--glare", now.glare.toFixed(3));
      badge.style.setProperty("--gx", now.gx + "%");
      badge.style.setProperty("--gy", now.gy + "%");
    };
    const step = () => {
      let moving = false;
      for (const k in now) {
        const diff = target[k] - now[k];
        now[k] += diff * 0.14;
        if (Math.abs(diff) > 0.01) moving = true;
      }
      paint();
      frame = moving ? requestAnimationFrame(step) : 0;
    };
    const kick = () => { if (!frame) frame = requestAnimationFrame(step); };

    if (enabled) {
      stage.addEventListener("pointermove", e => {
        badge = slots[current].querySelector(".badge");
        const r = badge.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width;
        const y = (e.clientY - r.top) / r.height;
        if (x < 0 || x > 1 || y < 0 || y > 1) target = { ...rest };
        else target = { rx: (0.5 - y) * 14, ry: (x - 0.5) * 18, lift: 1, glare: 1, gx: x * 100, gy: y * 100 };
        kick();
      });
      stage.addEventListener("pointerleave", () => { target = { ...rest }; kick(); });
    }

    return {
      reset() {
        if (badge) { badge.style.transform = ""; badge.style.removeProperty("--glare"); }
        cancelAnimationFrame(frame);
        frame = 0;
        badge = null;
        target = { ...rest };
        now = { ...rest };
      },
    };
  })();

  // The current badge sits centred above the prompt; the rest wait just below or above the stage.
  const PROMPT_SPACE = 64;
  let geo = { stageH: 0, cardH: 0, top: 0 };

  function measure() {
    const w = stage.clientWidth, h = stage.clientHeight;
    const cardW = Math.max(200, Math.min(290, w * 0.74, (h - PROMPT_SPACE - 32) / 1.58));
    stage.style.setProperty("--card-w", cardW + "px");
    const cardH = cardW * 1.58;
    geo = { stageH: h, cardH, top: Math.max(8, (h - PROMPT_SPACE - cardH) / 2) };
  }

  let current = 0;
  function render() {
    slots.forEach((slot, i) => {
      const d = i - current;
      let y = geo.top, r = 0, opacity = 1, z = 50, pos = "current";
      if (d < 0) {
        pos = "gone";
        y = -geo.cardH - 60; r = -4; z = 55;
        if (d < -1) opacity = 0;
      } else if (d > 0) {
        pos = "waiting";
        y = geo.stageH + 40; r = 4; z = 45;
        if (d > 1) opacity = 0;
      }
      slot.dataset.pos = pos;
      slot.style.transform = `translate(-50%, ${y}px) rotate(${r}deg)`;
      slot.style.opacity = opacity;
      slot.style.zIndex = z;
      slot.setAttribute("aria-hidden", d === 0 ? "false" : "true");
      slot.querySelectorAll("a").forEach(a => (a.tabIndex = d === 0 ? 0 : -1));
    });
    hintEl.textContent = current === posts.length - 1
      ? "That's all of them · scroll back to revisit"
      : "Scroll up to see more";
    tilt.reset();
  }
  function go(i) {
    const next = Math.max(0, Math.min(posts.length - 1, i));
    if (next === current) return;
    current = next;
    render();
  }

  // One scroll gesture moves one badge. Trackpads keep sending wheel events after the
  // fingers lift, so wait for a short pause before the next gesture counts.
  let acc = 0, lastWheel = 0, lastMove = 0, gestureUsed = false;
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    const t = performance.now();
    const pause = t - lastWheel;
    lastWheel = t;
    if (pause > 220) { gestureUsed = false; acc = 0; }
    if (gestureUsed || t - lastMove < 650) return;
    acc += e.deltaY;
    if (Math.abs(acc) > 30) {
      go(current + (acc > 0 ? 1 : -1));
      acc = 0;
      lastMove = t;
      gestureUsed = true;
    }
  }, { passive: false });

  let startY = null;
  stage.addEventListener("touchstart", e => { startY = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener("touchend", e => {
    if (startY === null) return;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dy) > 40) go(current + (dy < 0 ? 1 : -1));
    startY = null;
  }, { passive: true });

  document.addEventListener("keydown", e => {
    if (["ArrowDown", "ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(current + 1); }
    if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(current - 1); }
  });

  addEventListener("resize", () => {
    stage.classList.add("still");
    measure();
    render();
    requestAnimationFrame(() => stage.classList.remove("still"));
  });
  stage.classList.add("still");
  measure();
    render();
  requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove("still")));
  stage.focus({ preventScroll: true });
})();
</script>
</body>
</html>
