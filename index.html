<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page -->
<title>Said at Config India</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Rubik+Mono+One&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
  /* Layout: one conference badge at a time, centred on a carpet-teal backdrop; badges slide in and out sideways. */
  :root {
    --floor: #7fd0c9;          /* page backdrop, the hall carpet */
    --floor-ink: #0f2e2f;      /* text on the backdrop */
    --floor-soft: #2c5c5c;
    --paper: #fbfbf7;          /* badge card stock */
    --ink: #121417;            /* badge print */
    --ink-soft: #4a4f55;
    --rule: #121417;
    --focus: #45d35c;
    --bar: #000000;            /* header strip, same in both themes */
    --bar-edge: #6b4fd8;
    --control: #fbfbf7;
    --shadow: 0 18px 40px rgb(9 40 40 / .28), 0 2px 6px rgb(9 40 40 / .18);
    --stamp-sky: #74b9e2;
    --stamp-coral: #e86a4b;
    --stamp-leaf: #5cb052;
    --stamp-mustard: #f0d35b;
    --stamp-cyan: #45bacf;

    --font-display: "Rubik Mono One", "Arial Black", Impact, sans-serif;
    --font-body: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --card-w: clamp(264px, 78vw, 344px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --floor: #0e3537; --floor-ink: #e4f4f1; --floor-soft: #9cc7c3;
      --paper: #f1f1ec; --control: #1b4a4c;
      --shadow: 0 18px 44px rgb(0 0 0 / .5), 0 2px 6px rgb(0 0 0 / .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --floor: #0e3537; --floor-ink: #e4f4f1; --floor-soft: #9cc7c3;
    --paper: #f1f1ec; --control: #1b4a4c;
    --shadow: 0 18px 44px rgb(0 0 0 / .5), 0 2px 6px rgb(0 0 0 / .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 20% 10%, rgb(255 255 255 / .08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgb(0 0 0 / .08), transparent 45%),
      var(--floor);
    color: var(--floor-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding-block: 28px 36px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    gap: 8px;
  }

  .bar { background: var(--bar); border-top: 3px solid var(--bar-edge); }
  .bar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding-block: 18px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { margin: 0; line-height: 0; }
  h1 img { display: block; width: auto; height: 22px; max-width: 100%; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .credit {
    margin: 2px 0 0;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    font: 400 12px/1.3 var(--font-mono);
    color: var(--floor-soft);
  }
  .chip {
    font: 500 11px/1 var(--font-mono);
    letter-spacing: .04em;
    padding: 5px 8px;
    border: 1.5px dashed currentColor;
    border-radius: 999px;
    color: var(--floor-ink);
  }

  /* ---------- stage ---------- */
  .stage {
    position: relative;
    height: calc(var(--card-w) * 1.58 + 24px);
    overflow-x: clip;
    overflow-y: visible;
    margin-top: 10px;
    touch-action: pan-y;
  }
  .slot {
    position: absolute;
    top: 8px;
    left: 50%;
    width: var(--card-w);
    transform: translateX(-50%);
    transition: transform .5s cubic-bezier(.2, .8, .2, 1), opacity .4s ease;
  }
  .slot[data-pos="prev"], .slot[data-pos="before"] { transform: translateX(calc(-50% - 48px)); opacity: 0; pointer-events: none; }
  .slot[data-pos="next"], .slot[data-pos="after"] { transform: translateX(calc(-50% + 48px)); opacity: 0; pointer-events: none; }
  .slot[data-pos="current"] { z-index: 2; }

  /* ---------- badge ---------- */
  .badge {
    position: relative;
    aspect-ratio: 1 / 1.58;
    max-width: 100%;
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 34px 20px 18px;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    gap: 12px;
    will-change: transform;
  }
  /* light that follows the pointer while the badge tilts */
  .badge::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgb(255 255 255 / .45), rgb(255 255 255 / 0) 55%);
    mix-blend-mode: soft-light;
    opacity: var(--glare, 0);
  }
  @media (prefers-reduced-motion: reduce) {
    .slot { transition: none; }
  }

  .holes { position: absolute; top: 11px; left: 0; right: 0; display: flex; justify-content: center; gap: 64px; }
  .holes span {
    position: relative;
    width: 34px; height: 9px;
    border-radius: 6px;
    background: var(--floor);
    box-shadow: inset 0 1px 2px rgb(0 0 0 / .25);
  }
  .head { display: grid; gap: 4px; }
  .mark {
    font: 400 clamp(25px, 8.4vw, 33px)/.9 var(--font-display);
    letter-spacing: -.01em;
  }
  .mark img { display: block; width: 68%; height: auto; }
  .labels {
    display: flex; justify-content: space-between; gap: 8px;
    font: 500 12px/1.2 var(--font-body);
  }

  .panel {
    position: relative;
    min-height: 0;
    background: var(--accent);
    border-radius: 4px;
    padding: 34px 16px 16px;
    overflow: auto;
    scrollbar-width: thin;
  }
  .panel::before {
    content: "\201C";
    position: absolute;
    top: 2px; left: 12px;
    font: 400 46px/1 var(--font-display);
    color: var(--ink);
  }
  .quote {
    margin: 0;
    font-family: var(--font-body);
    font-weight: 500;
    letter-spacing: -.01em;
    line-height: 1.28;
    text-wrap: pretty;
    overflow-wrap: anywhere;
  }
  .quote.s1 { font-size: 23px; }
  .quote.s2 { font-size: 19px; }
  .quote.s3 { font-size: 16.5px; }
  .quote.s4 { font-size: 14.5px; line-height: 1.35; }

  .rule { height: 1px; background: var(--rule); }

  .foot { display: grid; gap: 4px; min-height: 0; }
  .line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .line .handle { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name {
    margin: 0 0 4px;
    font: 500 clamp(21px, 6.4vw, 26px)/1.05 var(--font-body);
    letter-spacing: -.02em;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  .name.long { font-size: clamp(18px, 5.4vw, 21px); }
  .name.longer { font-size: clamp(16px, 4.6vw, 18px); line-height: 1.12; }
  .meta {
    margin: 0;
    font: 400 12.5px/1.25 var(--font-body);
    color: var(--ink-soft);
    overflow-wrap: anywhere;
  }
  .meta.handle { color: var(--ink); }

  .xlink { flex: none; color: var(--ink); text-decoration: none; }
  .xlink:hover { text-decoration: underline; }
  .xlink:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }

  /* ---------- controls ---------- */
  .controls { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .controls button {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1.5px solid var(--floor-ink);
    background: var(--control);
    color: var(--floor-ink);
    font: 500 20px/1 var(--font-body);
    cursor: pointer;
    display: grid; place-items: center;
    transition: transform .15s ease, background .15s ease;
  }
  .controls button:hover:not(:disabled) { transform: translateY(-1px); }
  .controls button:active:not(:disabled) { transform: translateY(1px); }
  .controls button:disabled { opacity: .35; cursor: default; }
  .controls button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .count {
    margin: 0;
    min-width: 76px;
    text-align: center;
    font: 500 14px/1 var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  .hint {
    margin: 4px 0 0;
    text-align: center;
    font: 400 12px/1.4 var(--font-mono);
    color: var(--floor-soft);
  }
  .empty { text-align: center; padding-block: 80px; font-size: 16px; }
  .empty code { font-family: var(--font-mono); }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <h1><img src="logo-white.svg" alt="Config" width="705" height="140"><span class="sr-only">Said at Config India</span></h1>
  </div>
</header>

<main class="wrap">

  <section class="stage" id="stage" aria-roledescription="carousel" aria-label="Posts about Config India"></section>

  <nav class="controls" id="controls" aria-label="Browse posts">
    <button type="button" id="prev" aria-label="Previous post">&larr;</button>
    <p class="count" aria-live="polite"><span id="cur">01</span> / <span id="total">00</span></p>
    <button type="button" id="next" aria-label="Next post">&rarr;</button>
  </nav>
  <p class="hint" id="hint">Use the arrow keys or swipe</p>
  <p class="credit">Community collection · not made by Figma <span class="chip" id="sampleChip" hidden>Sample posts</span></p>
</main>

<script src="tweets.js"></script>
<script>
(() => {
  const posts = Array.isArray(window.TWEETS) ? window.TWEETS : [];
  const accents = ["--stamp-sky", "--stamp-coral", "--stamp-leaf", "--stamp-mustard", "--stamp-cyan"];
  const stage = document.getElementById("stage");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const curEl = document.getElementById("cur");
  const totalEl = document.getElementById("total");

  document.getElementById("sampleChip").hidden = window.SAMPLE !== true;

  if (!posts.length) {
    stage.innerHTML = '<p class="empty">No posts yet. Add them to <code>tweets.js</code>.</p>';
    document.getElementById("controls").hidden = true;
    document.getElementById("hint").hidden = true;
    return;
  }

  const pad = n => String(n).padStart(2, "0");
  const sizeClass = text => {
    const n = text.length;
    return n <= 110 ? "s1" : n <= 180 ? "s2" : n <= 260 ? "s3" : "s4";
  };
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };

  function buildBadge(post, i) {
    const slot = el("div", "slot");
    slot.dataset.index = i;
    slot.setAttribute("role", "group");
    slot.setAttribute("aria-roledescription", "slide");
    slot.setAttribute("aria-label", `${i + 1} of ${posts.length}`);

    const badge = el("article", "badge");
    badge.style.setProperty("--accent", `var(${accents[i % accents.length]})`);

    const holes = el("div", "holes");
    holes.append(el("span"), el("span"));

    const head = el("div", "head");
    const labels = el("div", "labels");
    labels.append(el("span", null, "India"));
    const mark = el("div", "mark");
    const logo = el("img");
    logo.src = "logo.svg";
    logo.alt = "Config";
    logo.addEventListener("error", () => { mark.textContent = "CONFIG"; });
    mark.append(logo);
    head.append(mark, labels);

    const text = String(post.text || "");
    const panel = el("div", "panel");
    const quote = el("p", `quote ${sizeClass(text)}`, text);
    panel.append(quote);

    const foot = el("div", "foot");
    const fullName = String(post.name || post.handle || "Unknown");
    const nameEl = el("p", "name", fullName);
    if (fullName.length > 28) nameEl.classList.add("longer");
    else if (fullName.length > 18) nameEl.classList.add("long");
    nameEl.title = fullName;
    foot.append(nameEl);
    const line = el("div", "line");
    const handle = post.handle ? "@" + String(post.handle).replace(/^@/, "") : "";
    const handleEl = el("span", "meta handle", handle);
    handleEl.title = handle;
    line.append(handleEl);
    if (post.url) {
      const link = el("a", "meta xlink", "View on X");
      link.href = post.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.setAttribute("aria-label", `Open ${post.name || "this"} post on X`);
      line.append(link);
    }
    foot.append(line);

    badge.append(holes, head, panel, el("div", "rule"), foot);
    slot.append(badge);
    return slot;
  }

  const slots = posts.map(buildBadge);
  stage.append(...slots);
  totalEl.textContent = pad(posts.length);

  // Tilt the current badge toward the pointer, easing in and out (mouse and trackpad only).
  const tilt = (() => {
    const enabled = matchMedia("(hover: hover) and (pointer: fine)").matches
      && !matchMedia("(prefers-reduced-motion: reduce)").matches;
    const rest = { rx: 0, ry: 0, lift: 0, glare: 0, gx: 50, gy: 50 };
    let target = { ...rest }, now = { ...rest }, badge = null, frame = 0;

    const paint = () => {
      if (!badge) return;
      badge.style.transform =
        `perspective(900px) rotateX(${now.rx}deg) rotateY(${now.ry}deg) scale(${1 + now.lift * 0.03})`;
      badge.style.setProperty("--glare", now.glare.toFixed(3));
      badge.style.setProperty("--gx", now.gx + "%");
      badge.style.setProperty("--gy", now.gy + "%");
    };
    const step = () => {
      let moving = false;
      for (const k in now) {
        const diff = target[k] - now[k];
        now[k] += diff * 0.14;
        if (Math.abs(diff) > 0.01) moving = true;
      }
      paint();
      frame = moving ? requestAnimationFrame(step) : 0;
    };
    const kick = () => { if (!frame) frame = requestAnimationFrame(step); };

    if (enabled) {
      stage.addEventListener("pointermove", e => {
        badge = slots[current].querySelector(".badge");
        const r = badge.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width;
        const y = (e.clientY - r.top) / r.height;
        if (x < 0 || x > 1 || y < 0 || y > 1) target = { ...rest };
        else target = { rx: (0.5 - y) * 14, ry: (x - 0.5) * 18, lift: 1, glare: 1, gx: x * 100, gy: y * 100 };
        kick();
      });
      stage.addEventListener("pointerleave", () => { target = { ...rest }; kick(); });
    }

    return {
      reset() {
        if (badge) { badge.style.transform = ""; badge.style.removeProperty("--glare"); }
        cancelAnimationFrame(frame);
        frame = 0;
        badge = null;
        target = { ...rest };
        now = { ...rest };
      },
    };
  })();

  let current = 0;
  function render() {
    slots.forEach((slot, i) => {
      const d = i - current;
      slot.dataset.pos = d === 0 ? "current" : d === -1 ? "prev" : d === 1 ? "next" : d < 0 ? "before" : "after";
      slot.setAttribute("aria-hidden", d === 0 ? "false" : "true");
      slot.querySelectorAll("a").forEach(a => (a.tabIndex = d === 0 ? 0 : -1));
    });
    curEl.textContent = pad(current + 1);
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === posts.length - 1;
    tilt.reset();
  }
  function go(i) {
    const next = Math.max(0, Math.min(posts.length - 1, i));
    if (next === current) return;
    current = next;
    render();
  }

  prevBtn.addEventListener("click", () => go(current - 1));
  nextBtn.addEventListener("click", () => go(current + 1));
  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if (e.key === "ArrowLeft") go(current - 1);
    if (e.key === "ArrowRight") go(current + 1);
  });

  let startX = null, startY = null;
  stage.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  stage.addEventListener("touchend", e => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(current + (dx < 0 ? 1 : -1));
    startX = startY = null;
  }, { passive: true });

  render();
})();
</script>
</body>
</html>
