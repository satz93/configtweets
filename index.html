<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page -->
<title>Said at Config India</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Rubik+Mono+One&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
  /* Layout: one badge hangs on a black neck band in front of a lilac wall scattered with black dot clusters (the Config India registration wall). Scrolling slides the badge off the top and brings the next one up from below. Single light look by design. */
  :root {
    --floor: #c9a3e6;          /* the lilac wall */
    --floor-ink: #17121d;      /* text on the wall */
    --floor-soft: #463457;
    --dots: #121014;           /* dot clusters on the wall */
    --band: #141414;           /* neck band and clip */
    --band-weave: #1f1f1f;
    --paper: #fbfbf7;          /* badge card stock */
    --ink: #121417;            /* badge print */
    --ink-soft: #4a4f55;
    --rule: #121417;
    --focus: #45d35c;
    --shadow: 0 22px 44px rgb(48 20 78 / .3), 0 2px 6px rgb(48 20 78 / .2);
    --stamp-sky: #74b9e2;
    --stamp-coral: #e86a4b;
    --stamp-leaf: #5cb052;
    --stamp-mustard: #f0d35b;
    --stamp-cyan: #45bacf;

    --font-display: "Rubik Mono One", "Arial Black", Impact, sans-serif;
    --font-body: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --card-w: 320px;           /* set from the window size by script */
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    position: relative;
    overflow: hidden;
    background: var(--floor);
    color: var(--floor-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .bar-inner {
    padding-block: 18px 6px;
    padding-left: max(clamp(16px, 2.5vw, 32px), env(safe-area-inset-left, 0px));
    padding-right: max(clamp(16px, 2.5vw, 32px), env(safe-area-inset-right, 0px));
    display: grid;
    gap: 8px;
  }
  .bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; line-height: 0; }
  h1 img { width: auto; height: 22px; max-width: 100%; }
  .bar { position: absolute; top: 0; left: 0; right: 0; z-index: 200; pointer-events: none; }
  @media (max-width: 560px) {
    .credit {
      position: fixed;
      left: 0; right: 0;
      bottom: max(10px, env(safe-area-inset-bottom, 0px));
      justify-content: center;
      font-size: 11px;
    }
    .prompt { bottom: max(44px, calc(env(safe-area-inset-bottom, 0px) + 34px)); }
  }
  #wall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .credit {
    margin: 0;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    font: 400 12px/1.3 var(--font-mono);
    color: var(--floor-soft);
  }
  /* ---------- stage ---------- */
  .stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    outline: none;
  }
  .slot {
    position: absolute;
    top: 0;
    left: 50%;
    width: var(--card-w);
    transition: transform .7s cubic-bezier(.2, .8, .2, 1), opacity .45s ease;
  }
  .prompt {
    position: absolute;
    left: 0; right: 0;
    bottom: max(22px, env(safe-area-inset-bottom, 0px));
    margin: 0;
    text-align: center;
    font: 400 14px/1.3 var(--font-body);
    color: var(--floor-ink);
    z-index: 100;
    pointer-events: none;
  }
  .stage.still .slot { transition: none; }

  /* ---------- badge ---------- */
  .badge {
    position: relative;
    aspect-ratio: 1 / 1.58;
    max-width: 100%;
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 34px 20px 18px;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    gap: 12px;
    will-change: transform;
  }
  /* light that follows the pointer while the badge tilts */
  .badge::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgb(255 255 255 / .45), rgb(255 255 255 / 0) 55%);
    mix-blend-mode: soft-light;
    opacity: var(--glare, 0);
  }
  @media (prefers-reduced-motion: reduce) {
    .slot { transition: opacity .2s ease; }
  }

  /* neck band: the strap belongs to the slot, the clip to the badge so it tilts with it */
  .strap {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 10px);
    width: 34px;
    height: 120vh;
    transform: translateX(-50%);
    background: repeating-linear-gradient(0deg, var(--band) 0 3px, var(--band-weave) 3px 4px);
    box-shadow: inset 2px 0 0 rgb(255 255 255 / .06), inset -2px 0 0 rgb(0 0 0 / .35), 0 6px 18px rgb(48 20 78 / .25);
    opacity: 0;
    transition: opacity .25s ease;
  }
  .slot[data-pos="current"] .strap { opacity: 1; transition: opacity .35s ease .35s; }
  .clip {
    position: absolute;
    top: -20px;
    left: 50%;
    width: 50px;
    height: 38px;
    transform: translateX(-50%);
    border: 7px solid var(--band);
    border-radius: 9px;
    box-shadow: 0 2px 4px rgb(0 0 0 / .25);
  }
  .head { display: grid; gap: 4px; }
  .mark {
    font: 400 clamp(25px, 8.4vw, 33px)/.9 var(--font-display);
    letter-spacing: -.01em;
  }
  .mark img { display: block; width: 68%; height: auto; }
  .labels {
    display: flex; justify-content: space-between; gap: 8px;
    font: 500 12px/1.2 var(--font-body);
  }

  .panel {
    position: relative;
    min-height: 0;
    background: var(--accent);
    border-radius: 4px;
    padding: 34px 16px 16px;
    overflow: auto;
    scrollbar-width: thin;
  }
  .panel::before {
    content: "\201C";
    position: absolute;
    top: 2px; left: 12px;
    font: 400 46px/1 var(--font-display);
    color: var(--ink);
  }
  .quote {
    margin: 0;
    font-family: var(--font-body);
    font-weight: 500;
    letter-spacing: -.01em;
    line-height: 1.28;
    text-wrap: pretty;
    overflow-wrap: anywhere;
  }
  .quote.s1 { font-size: 23px; }
  .quote.s2 { font-size: 19px; }
  .quote.s3 { font-size: 16.5px; }
  .quote.s4 { font-size: 14.5px; line-height: 1.35; }

  .rule { height: 1px; background: var(--rule); }

  .foot { display: grid; gap: 4px; min-height: 0; }
  .line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .line .handle { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name {
    margin: 0 0 4px;
    font: 500 clamp(21px, 6.4vw, 26px)/1.05 var(--font-body);
    letter-spacing: -.02em;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  .name.long { font-size: clamp(18px, 5.4vw, 21px); }
  .name.longer { font-size: clamp(16px, 4.6vw, 18px); line-height: 1.12; }
  .meta {
    margin: 0;
    font: 400 12.5px/1.25 var(--font-body);
    color: var(--ink-soft);
    overflow-wrap: anywhere;
  }
  .meta.handle { color: var(--ink); }

  .xlink { flex: none; color: var(--ink); text-decoration: none; }
  .xlink:hover { text-decoration: underline; }
  .xlink:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }

  .empty { text-align: center; padding: 80px 16px; font-size: 16px; }
  .empty code { font-family: var(--font-mono); }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <div class="bar-row">
      <h1><img src="logo.svg" alt="Config" width="705" height="140"><span class="sr-only">Said at Config India</span></h1>
    </div>
    <p class="credit">Community collection · not made by Figma</p>
  </div>
</header>

<canvas id="wall" aria-hidden="true"></canvas>
<main class="stage" id="stage" tabindex="-1" aria-roledescription="carousel" aria-label="Posts about Config India">
  <p class="prompt" id="hint">Scroll up to see more</p>
</main>

<script src="tweets.js"></script>
<script>
(() => {
  const posts = Array.isArray(window.TWEETS) ? window.TWEETS : [];
  const accents = ["--stamp-sky", "--stamp-coral", "--stamp-leaf", "--stamp-mustard", "--stamp-cyan"];
  const stage = document.getElementById("stage");
  const hintEl = document.getElementById("hint");

  if (!posts.length) {
    stage.innerHTML = '<p class="empty">No posts yet. Add them to <code>tweets.js</code>.</p>';
    return;
  }

  const sizeClass = text => {
    const n = text.length;
    return n <= 110 ? "s1" : n <= 180 ? "s2" : n <= 260 ? "s3" : "s4";
  };
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };

  function buildBadge(post, i) {
    const slot = el("div", "slot");
    slot.dataset.index = i;
    slot.setAttribute("role", "group");
    slot.setAttribute("aria-roledescription", "slide");
    slot.setAttribute("aria-label", `${i + 1} of ${posts.length}`);

    const badge = el("article", "badge");
    badge.style.setProperty("--accent", `var(${accents[i % accents.length]})`);


    const head = el("div", "head");
    const labels = el("div", "labels");
    labels.append(el("span", null, "India"));
    const mark = el("div", "mark");
    const logo = el("img");
    logo.src = "logo.svg";
    logo.alt = "Config";
    logo.addEventListener("error", () => { mark.textContent = "CONFIG"; });
    mark.append(logo);
    head.append(mark, labels);

    const text = String(post.text || "");
    const panel = el("div", "panel");
    const quote = el("p", `quote ${sizeClass(text)}`, text);
    panel.append(quote);

    const foot = el("div", "foot");
    const fullName = String(post.name || post.handle || "Unknown");
    const nameEl = el("p", "name", fullName);
    if (fullName.length > 28) nameEl.classList.add("longer");
    else if (fullName.length > 18) nameEl.classList.add("long");
    nameEl.title = fullName;
    foot.append(nameEl);
    const line = el("div", "line");
    const handle = post.handle ? "@" + String(post.handle).replace(/^@/, "") : "";
    const handleEl = el("span", "meta handle", handle);
    handleEl.title = handle;
    line.append(handleEl);
    if (post.url) {
      const link = el("a", "meta xlink", "View on X");
      link.href = post.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.setAttribute("aria-label", `Open ${post.name || "this"} post on X`);
      line.append(link);
    }
    foot.append(line);

    badge.append(el("span", "clip"), head, panel, el("div", "rule"), foot);
    slot.append(el("span", "strap"), badge);
    return slot;
  }

  const slots = posts.map(buildBadge);
  stage.append(...slots);

  // The wall: clusters of black ovals along the top and bottom edges, like the registration wall.
  // Seeded, so the pattern stays put between loads and resizes.
  const wall = document.getElementById("wall");
  function drawWall() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    const w = innerWidth, h = innerHeight;
    wall.width = w * dpr;
    wall.height = h * dpr;
    const ctx = wall.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--dots").trim() || "#121014";

    let seed = 15102026;
    const rand = () => {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const gauss = () => (rand() + rand() + rand() - 1.5) / 1.5;
    const scale = Math.max(0.65, Math.min(1, w / 1200));
    // keep the dots off the logo, the credit line and the scroll prompt
    const clear = ["h1 img", ".credit", "#hint"]
      .map(sel => document.querySelector(sel))
      .filter(Boolean)
      .map(node => {
        const r = node.getBoundingClientRect();
        return { l: r.left - 18, r: r.right + 18, t: r.top - 14, b: r.bottom + 14 };
      });
    const blocked = (x, y) => clear.some(c => x > c.l && x < c.r && y > c.t && y < c.b);

    const cluster = (cx, cy, count, spread) => {
      for (let i = 0; i < count; i++) {
        const x = cx + gauss() * spread * 1.6;
        const y = cy + gauss() * spread;
        const rx = (5 + rand() * 8) * scale;
        if (blocked(x, y)) continue;
        ctx.beginPath();
        ctx.ellipse(x, y, rx, rx * (0.62 + rand() * 0.25), (rand() - 0.5) * 1.2, 0, Math.PI * 2);
        ctx.fill();
      }
    };

    const across = Math.max(3, Math.round(w / 230));
    for (let i = 0; i < across; i++) {
      const x = ((i + 0.2 + rand() * 0.6) / across) * w;
      cluster(x, rand() * h * 0.09, 14 + rand() * 30, (22 + rand() * 30) * scale);
      cluster(((i + 0.2 + rand() * 0.6) / across) * w, h - rand() * h * 0.12, 12 + rand() * 28, (20 + rand() * 30) * scale);
    }
    // a few on the side edges, away from the badge
    for (let i = 0; i < 4; i++) {
      const left = i % 2 === 0;
      const x = left ? rand() * w * 0.12 : w - rand() * w * 0.12;
      cluster(x, h * (0.25 + rand() * 0.5), 10 + rand() * 18, (18 + rand() * 24) * scale);
    }
  }

  // Tilt the current badge toward the pointer, easing in and out (mouse and trackpad only).
  const tilt = (() => {
    const enabled = matchMedia("(hover: hover) and (pointer: fine)").matches
      && !matchMedia("(prefers-reduced-motion: reduce)").matches;
    const rest = { rx: 0, ry: 0, lift: 0, glare: 0, gx: 50, gy: 50 };
    let target = { ...rest }, now = { ...rest }, badge = null, frame = 0;

    const paint = () => {
      if (!badge) return;
      badge.style.transform =
        `perspective(900px) rotateX(${now.rx}deg) rotateY(${now.ry}deg) scale(${1 + now.lift * 0.03})`;
      badge.style.setProperty("--glare", now.glare.toFixed(3));
      badge.style.setProperty("--gx", now.gx + "%");
      badge.style.setProperty("--gy", now.gy + "%");
    };
    const step = () => {
      let moving = false;
      for (const k in now) {
        const diff = target[k] - now[k];
        now[k] += diff * 0.14;
        if (Math.abs(diff) > 0.01) moving = true;
      }
      paint();
      frame = moving ? requestAnimationFrame(step) : 0;
    };
    const kick = () => { if (!frame) frame = requestAnimationFrame(step); };

    if (enabled) {
      stage.addEventListener("pointermove", e => {
        badge = slots[current].querySelector(".badge");
        const r = badge.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width;
        const y = (e.clientY - r.top) / r.height;
        if (x < 0 || x > 1 || y < 0 || y > 1) target = { ...rest };
        else target = { rx: (0.5 - y) * 14, ry: (x - 0.5) * 18, lift: 1, glare: 1, gx: x * 100, gy: y * 100 };
        kick();
      });
      stage.addEventListener("pointerleave", () => { target = { ...rest }; kick(); });
    }

    return {
      reset() {
        if (badge) { badge.style.transform = ""; badge.style.removeProperty("--glare"); }
        cancelAnimationFrame(frame);
        frame = 0;
        badge = null;
        target = { ...rest };
        now = { ...rest };
      },
    };
  })();

  // The current badge sits centred above the prompt; the rest wait just below or above the stage.
  const PROMPT_SPACE = 64;
  let geo = { stageH: 0, cardH: 0, top: 0 };

  function measure() {
    const w = stage.clientWidth, h = stage.clientHeight;
    const headH = document.querySelector(".bar").offsetHeight + 34;
    const cardW = Math.max(200, Math.min(290, w * 0.74, (h - headH - PROMPT_SPACE - 8) / 1.58));
    stage.style.setProperty("--card-w", cardW + "px");
    const cardH = cardW * 1.58;
    geo = { stageH: h, cardH, top: Math.max(headH, (h - PROMPT_SPACE - cardH) / 2 + 12) };
  }

  let current = 0;
  function render() {
    slots.forEach((slot, i) => {
      const d = i - current;
      let y = geo.top, r = 0, opacity = 1, z = 50, pos = "current";
      if (d < 0) {
        pos = "gone";
        y = -geo.cardH - 60; r = -4; z = 55;
        if (d < -1) opacity = 0;
      } else if (d > 0) {
        pos = "waiting";
        y = geo.stageH + 40; r = 4; z = 45;
        if (d > 1) opacity = 0;
      }
      slot.dataset.pos = pos;
      slot.style.transform = `translate(-50%, ${y}px) rotate(${r}deg)`;
      slot.style.opacity = opacity;
      slot.style.zIndex = z;
      slot.setAttribute("aria-hidden", d === 0 ? "false" : "true");
      slot.querySelectorAll("a").forEach(a => (a.tabIndex = d === 0 ? 0 : -1));
    });
    hintEl.textContent = current === posts.length - 1
      ? "That's all of them · scroll back to revisit"
      : "Scroll up to see more";
    tilt.reset();
  }
  function go(i) {
    const next = Math.max(0, Math.min(posts.length - 1, i));
    if (next === current) return;
    current = next;
    render();
  }

  // One scroll gesture moves one badge. Trackpads keep sending wheel events after the
  // fingers lift, so wait for a short pause before the next gesture counts.
  let acc = 0, lastWheel = 0, lastMove = 0, gestureUsed = false;
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    const t = performance.now();
    const pause = t - lastWheel;
    lastWheel = t;
    if (pause > 220) { gestureUsed = false; acc = 0; }
    if (gestureUsed || t - lastMove < 650) return;
    acc += e.deltaY;
    if (Math.abs(acc) > 30) {
      go(current + (acc > 0 ? 1 : -1));
      acc = 0;
      lastMove = t;
      gestureUsed = true;
    }
  }, { passive: false });

  let startY = null;
  stage.addEventListener("touchstart", e => { startY = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener("touchend", e => {
    if (startY === null) return;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dy) > 40) go(current + (dy < 0 ? 1 : -1));
    startY = null;
  }, { passive: true });

  document.addEventListener("keydown", e => {
    if (["ArrowDown", "ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(current + 1); }
    if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(current - 1); }
  });

  addEventListener("resize", () => {
    drawWall();
    stage.classList.add("still");
    measure();
    render();
    requestAnimationFrame(() => stage.classList.remove("still"));
  });
  drawWall();
  stage.classList.add("still");
  measure();
    render();
  requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove("still")));
  stage.focus({ preventScroll: true });
})();
</script>
</body>
</html>
