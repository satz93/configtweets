<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page -->
<title>Said at Config India</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Rubik+Mono+One&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
  /* Layout: one badge in front of a speaker-card backdrop: a bright solid colour with off-white rough patches or oval swirls, changing with each post. Scrolling moves the badge with the scroll: it slides up off the top while the next one rises from below, then settles. Single light look by design. */
  :root {
    --floor: #d2a7e2;          /* backdrop colour, set per post by script */
    --wall-lilac: #d2a7e2;
    --wall-green: #2fcb7b;
    --wall-yellow: #f7f56c;
    --wall-orange: #ff7b3c;
    --pattern: #ebe9ea;        /* off-white patches and ovals */
    --floor-ink: #17121d;      /* text on the wall */
    --floor-soft: #463457;
    --paper: #fbfbf7;          /* badge card stock */
    --ink: #121417;            /* badge print */
    --ink-soft: #4a4f55;
    --rule: #121417;
    --focus: #45d35c;
    --shadow:                  /* deep, layered drop shadow: contact, mid and a long soft fall-off */
      0 1px 2px rgb(18 12 24 / .16),
      0 6px 12px -2px rgb(18 12 24 / .14),
      0 24px 40px -8px rgb(18 12 24 / .32),
      0 56px 90px -16px rgb(18 12 24 / .42);

    --font-display: "Rubik Mono One", "Arial Black", Impact, sans-serif;
    --font-body: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --card-w: 320px;           /* set from the window size by script */
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    position: relative;
    overflow: hidden;
    background: var(--floor);
    color: var(--floor-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .bar-inner {
    padding-block: 18px 6px;
    padding-left: max(clamp(16px, 2.5vw, 32px), env(safe-area-inset-left, 0px));
    padding-right: max(clamp(16px, 2.5vw, 32px), env(safe-area-inset-right, 0px));
    display: grid;
    gap: 8px;
  }
  .bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; line-height: 0; }
  h1 img { width: auto; height: 22px; max-width: 100%; }
  .bar { position: absolute; top: 0; left: 0; right: 0; z-index: 200; pointer-events: none; }
  .wall {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    opacity: 0;
    transition: opacity .6s ease;
  }
  .wall.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .wall { transition: none; } }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .credit {
    margin: 0;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    font: 400 12px/1.3 var(--font-mono);
    color: var(--floor-soft);
  }
  /* ---------- stage ---------- */
  .stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    outline: none;
    z-index: 2;
  }
  .deck { position: absolute; inset: 0; }
  .slot {
    position: absolute;
    top: 0;
    left: 50%;
    width: var(--card-w);
    will-change: transform;
  }
  .prompt {
    position: absolute;
    left: 0; right: 0;
    bottom: max(22px, env(safe-area-inset-bottom, 0px));
    margin: 0;
    text-align: center;
    font: 400 14px/1.3 var(--font-body);
    color: var(--floor-ink);
    z-index: 100;
    pointer-events: none;
  }

  /* ---------- badge ---------- */
  .badge {
    position: relative;
    aspect-ratio: 1 / 1.58;
    max-width: 100%;
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 34px 20px 18px;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    gap: 14px;
    will-change: transform;
  }
  /* light that follows the pointer while the badge tilts */
  .badge::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgb(255 255 255 / .45), rgb(255 255 255 / 0) 55%);
    mix-blend-mode: soft-light;
    opacity: var(--glare, 0);
  }

  .holes { position: absolute; top: 11px; left: 0; right: 0; display: flex; justify-content: center; gap: 64px; }
  .holes span {
    position: relative;
    width: 34px; height: 9px;
    border-radius: 6px;
    background: var(--floor);
    box-shadow: inset 0 1px 2px rgb(0 0 0 / .25);
  }
  .panel { position: relative; min-height: 0; overflow: hidden; }
  /* dot matrix revealed around the pointer */
  .dots { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; border-radius: inherit; z-index: 2; }
  .quote {
    position: relative;
    z-index: 1;
    margin: 0;
    font-family: var(--font-body);
    font-weight: 500;
    letter-spacing: -.01em;
    line-height: 1.28;
    text-wrap: pretty;
    overflow-wrap: anywhere;
  }
  /* small scalloped mark in the post's colour, top left */
  .art { width: 26%; aspect-ratio: 1; margin-left: -4px; color: var(--accent); }
  .art svg { display: block; width: 100%; height: 100%; }
  .quote.s1 { font-size: 23px; }
  .quote.s2 { font-size: 19px; }
  .quote.s3 { font-size: 16.5px; }
  .quote.s4 { font-size: 14.5px; line-height: 1.35; }

  .rule { height: 1px; background: var(--rule); }

  .foot { display: grid; gap: 4px; min-height: 0; }
  .line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .line .handle { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name {
    margin: 0 0 4px;
    font: 500 18px/1.15 var(--font-body);
    letter-spacing: -.02em;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  .meta {
    margin: 0;
    font: 400 12.5px/1.25 var(--font-body);
    color: var(--ink-soft);
    overflow-wrap: anywhere;
  }
  .meta.handle { color: var(--ink); }

  .xlink { flex: none; color: var(--ink); text-decoration: none; }
  .xlink:hover { text-decoration: underline; }
  .xlink:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }

  .empty { text-align: center; padding: 80px 16px; font-size: 16px; }
  .empty code { font-family: var(--font-mono); }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <div class="bar-row">
      <h1><img src="logo.svg" alt="Config" width="705" height="140"><span class="sr-only">Said at Config India</span></h1>
    </div>
    <p class="credit">Community collection · not made by Figma</p>
  </div>
</header>

<canvas class="wall" aria-hidden="true"></canvas>
<canvas class="wall" aria-hidden="true"></canvas>
<main class="stage" id="stage" tabindex="-1" aria-roledescription="carousel" aria-label="Posts about Config India">
  <p class="prompt" id="hint">Scroll up to see more</p>
</main>

<script src="tweets.js"></script>
<script>
(() => {
  const posts = Array.isArray(window.TWEETS) ? window.TWEETS : [];
  // Each post gets a backdrop colour and pattern style; the badge's mark uses the same colour.
  const SCHEMES = [
    { wall: "--wall-lilac", pattern: "patches" },
    { wall: "--wall-green", pattern: "ovals" },
    { wall: "--wall-yellow", pattern: "patches" },
    { wall: "--wall-orange", pattern: "ovals" },
  ];
  const schemeFor = i => SCHEMES[i % SCHEMES.length];
  const stage = document.getElementById("stage");
  const hintEl = document.getElementById("hint");

  if (!posts.length) {
    stage.innerHTML = '<p class="empty">No posts yet. Add them to <code>tweets.js</code>.</p>';
    return;
  }

  const sizeClass = text => {
    const n = text.length;
    return n <= 110 ? "s1" : n <= 180 ? "s2" : n <= 260 ? "s3" : "s4";
  };
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };

  // Scalloped marks like the badge illustrations: a shape filled in the post's colour, with circles
  // along its edges so the outline looks puffy. Shapes take turns: star, ring, cloud.
  function artFor(i) {
    const rand = (seed => () => {
      seed = (seed * 16807) % 2147483647;
      return seed / 2147483647;
    })(i * 4099 + 17);
    const star = (R, r, rot = -Math.PI / 2) => Array.from({ length: 10 }, (_, k) => {
      const a = rot + (k * Math.PI) / 5, rad = k % 2 ? r : R;
      return [50 + Math.cos(a) * rad, 50 + Math.sin(a) * rad];
    });
    const circle = (R, n = 28) => Array.from({ length: n }, (_, k) => {
      const a = (k / n) * Math.PI * 2;
      return [50 + Math.cos(a) * R, 50 + Math.sin(a) * R];
    });
    // walk the outline and drop puffs every few units
    const puffs = (pts, size, fill) => {
      let out = "";
      for (let k = 0; k < pts.length; k++) {
        const [x1, y1] = pts[k], [x2, y2] = pts[(k + 1) % pts.length];
        const len = Math.hypot(x2 - x1, y2 - y1), steps = Math.max(1, Math.round(len / (size * 0.9)));
        for (let s = 0; s < steps; s++) {
          const t = s / steps;
          out += `<circle cx="${(x1 + (x2 - x1) * t).toFixed(1)}" cy="${(y1 + (y2 - y1) * t).toFixed(1)}" r="${(size * (0.8 + rand() * 0.4)).toFixed(1)}" fill="${fill}"/>`;
        }
      }
      return out;
    };
    const poly = (pts, fill) => `<polygon points="${pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")}" fill="${fill}"/>`;
    const ink = "currentColor", paper = "var(--paper)";
    const kind = i % 3;
    let body;
    if (kind === 0) {
      const outer = star(42, 22), hole = star(15, 8);
      body = poly(outer, ink) + puffs(outer, 6.5, ink) + poly(hole, paper) + puffs(hole, 3.6, paper);
    } else if (kind === 1) {
      const outer = circle(38), hole = circle(14, 16);
      body = poly(outer, ink) + puffs(outer, 7, ink) + poly(hole, paper) + puffs(hole, 4, paper);
    } else {
      const lobes = [[50, 30], [70, 42], [64, 66], [38, 68], [30, 44]];
      body = `<circle cx="50" cy="51" r="20" fill="${ink}"/>`
        + lobes.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${(15 + rand() * 4).toFixed(1)}" fill="${ink}"/>`).join("")
        + puffs(circle(33, 22), 6, ink);
    }
    return `<svg viewBox="0 0 100 100" focusable="false">${body}</svg>`;
  }

  function buildBadge(post, i) {
    const slot = el("div", "slot");
    slot.dataset.index = i;
    slot.setAttribute("role", "group");
    slot.setAttribute("aria-roledescription", "slide");
    slot.setAttribute("aria-label", `${i + 1} of ${posts.length}`);

    const badge = el("article", "badge");
    badge.style.setProperty("--accent", `var(${schemeFor(i).wall})`);


    const art = el("div", "art");
    art.innerHTML = artFor(i);
    art.setAttribute("aria-hidden", "true");

    const text = String(post.text || "");
    const panel = el("div", "panel");
    panel.append(el("p", `quote ${sizeClass(text)}`, text));

    const foot = el("div", "foot");
    const fullName = String(post.name || post.handle || "Unknown");
    const nameEl = el("p", "name", fullName);
    nameEl.title = fullName;
    foot.append(nameEl);
    const line = el("div", "line");
    if (post.url) {
      const link = el("a", "meta xlink", "View on X");
      link.href = post.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.setAttribute("aria-label", `Open ${post.name || "this"} post on X`);
      line.append(link);
    }
    foot.append(line);

    const holes = el("div", "holes");
    holes.append(el("span"), el("span"));
    badge.append(holes, art, panel, el("div", "rule"), foot);
    slot.append(badge);
    return slot;
  }

  const slots = posts.map(buildBadge);
  const deck = el("div", "deck");
  deck.append(...slots);
  stage.prepend(deck);

  // The backdrop, drawn per post on one of two canvases so the new one can fade in over the old.
  // Seeded by the post number, so each post always gets the same picture.
  const walls = [...document.querySelectorAll(".wall")];
  let shownWall = -1, wallFor = -1;
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function noise2(seed) {
    const hash = (x, y) => {
      let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 982451653);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    };
    const smooth = t => t * t * (3 - 2 * t);
    const value = (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = smooth(x - xi), yf = smooth(y - yi);
      const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
      return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
    };
    return (x, y) => (value(x, y) * 0.6 + value(x * 2.1, y * 2.1) * 0.28 + value(x * 4.3, y * 4.3) * 0.12);
  }

  function paintWall(canvas, index) {
    const sc = schemeFor(index);
    const dpr = Math.min(1.5, devicePixelRatio || 1);
    const w = innerWidth, h = innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = css(sc.wall);
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = css("--pattern");

    const rand = rng(1510 + index * 7919);
    const noise = noise2(index + 11);
    const scale = Math.max(0.7, Math.min(1, w / 1200));
    const cx = w / 2, cy = h * 0.5;

    // keep the logo, credit line and scroll prompt readable
    const clear = ["h1 img", ".credit", "#hint"]
      .map(sel => document.querySelector(sel))
      .filter(Boolean)
      .map(node => {
        // measure the text itself, not the full-width line it sits in
        const range = document.createRange();
        range.selectNodeContents(node);
        const r = range.getBoundingClientRect();
        return { l: r.left - 16, r: r.right + 16, t: r.top - 12, b: r.bottom + 12 };
      });
    const blocked = (x, y) => clear.some(c => x > c.l && x < c.r && y > c.t && y < c.b);
    // 1 inside a clear area, fading to 0 over 40px around it
    const nearText = (x, y) => Math.max(0, ...clear.map(c => {
      const dx = Math.max(c.l - x, 0, x - c.r), dy = Math.max(c.t - y, 0, y - c.b);
      return 1 - Math.min(1, Math.hypot(dx, dy) / 40);
    }));

    if (sc.pattern === "patches") {
      // Rough-edged patches: a noise field cut at a threshold, drawn in small cells so the edges look torn.
      const cell = 5;
      const ox = rand() * 50, oy = rand() * 50;
      for (let y = 0; y < h; y += cell) {
        for (let x = 0; x < w; x += cell) {
          const dx = (x - cx) / (w / 2), dy = (y - cy) / (h / 2);
          const edge = Math.min(1, Math.hypot(dx, dy) / 1.2);
          const v = noise(ox + x / (210 * scale), oy + y / (210 * scale))
            + noise(ox * 3 + x / 16, oy * 3 + y / 16) * 0.12
            + edge * 0.18
            - nearText(x, y) * 0.5;
          if (v > 0.72) ctx.fillRect(x, y, cell + 0.5, cell + 0.5);
        }
      }
    } else {
      // Oval swirls: walkers circle the middle of the screen, dropping clusters of ovals as they go.
      const rx = Math.max(w * 0.3, Math.min(w, h) * 0.42), ry = h * 0.36;
      const walkers = Math.round(22 + 10 * scale);
      for (let k = 0; k < walkers; k++) {
        let a = rand() * Math.PI * 2;
        let r = 0.85 + rand() * 0.55;
        const dir = rand() < 0.5 ? -1 : 1;
        const steps = 18 + rand() * 40;
        for (let s = 0; s < steps; s++) {
          a += dir * (0.025 + rand() * 0.02);
          r += (rand() - 0.5) * 0.05;
          const px = cx + Math.cos(a) * rx * r, py = cy + Math.sin(a) * ry * r;
          if (noise(px / 120, py / 120) < 0.36) continue;   // leave gaps in the swirl
          const tangent = a + (dir * Math.PI) / 2;
          for (let n = 0; n < 3; n++) {
            const x = px + (rand() - 0.5) * 26 * scale, y = py + (rand() - 0.5) * 26 * scale;
            if (blocked(x, y)) continue;
            const ox = (6 + rand() * 3.5) * scale;
            ctx.beginPath();
            ctx.ellipse(x, y, ox, ox * (0.68 + rand() * 0.14), tangent + (rand() - 0.5) * 0.8, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }
  }

  function showWall(index, instant) {
    if (index === wallFor && !instant) return;
    wallFor = index;
    const next = shownWall === 0 ? 1 : 0;
    paintWall(walls[next], index);
    document.documentElement.style.setProperty("--floor", css(schemeFor(index).wall));
    if (instant) walls.forEach(c => (c.style.transition = "none"));
    walls[next].style.zIndex = 1;
    walls[next].classList.add("on");
    if (shownWall >= 0) {
      const old = walls[shownWall];
      old.style.zIndex = 0;
      // hide the old one once the new one has faded in, unless it has become the current one again
      setTimeout(() => { if (walls[shownWall] !== old) old.classList.remove("on"); }, instant ? 0 : 650);
    }
    if (instant) requestAnimationFrame(() => walls.forEach(c => (c.style.transition = "")));
    shownWall = next;
  }

  // Tilt the current badge toward the pointer, easing in and out (mouse and trackpad only).
  const tilt = (() => {
    const enabled = matchMedia("(hover: hover) and (pointer: fine)").matches
      && !matchMedia("(prefers-reduced-motion: reduce)").matches;
    const rest = { rx: 0, ry: 0, lift: 0, glare: 0, gx: 50, gy: 50 };
    let target = { ...rest }, now = { ...rest }, badge = null, frame = 0;

    const paint = () => {
      if (!badge) return;
      badge.style.transform =
        `perspective(900px) rotateX(${now.rx}deg) rotateY(${now.ry}deg) scale(${1 + now.lift * 0.03})`;
      badge.style.setProperty("--glare", now.glare.toFixed(3));
      badge.style.setProperty("--gx", now.gx + "%");
      badge.style.setProperty("--gy", now.gy + "%");
    };
    const step = () => {
      let moving = false;
      for (const k in now) {
        const diff = target[k] - now[k];
        now[k] += diff * 0.14;
        if (Math.abs(diff) > 0.01) moving = true;
      }
      paint();
      frame = moving ? requestAnimationFrame(step) : 0;
    };
    const kick = () => { if (!frame) frame = requestAnimationFrame(step); };

    if (enabled) {
      stage.addEventListener("pointermove", e => {
        badge = slots[current].querySelector(".badge");
        const r = badge.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width;
        const y = (e.clientY - r.top) / r.height;
        if (x < 0 || x > 1 || y < 0 || y > 1) target = { ...rest };
        else target = { rx: (0.5 - y) * 14, ry: (x - 0.5) * 18, lift: 1, glare: 1, gx: x * 100, gy: y * 100 };
        kick();
      });
      stage.addEventListener("pointerleave", () => { target = { ...rest }; kick(); });
    }

    return {
      reset() {
        if (badge) { badge.style.transform = ""; badge.style.removeProperty("--glare"); }
        cancelAnimationFrame(frame);
        frame = 0;
        badge = null;
        target = { ...rest };
        now = { ...rest };
      },
    };
  })();

  // The current badge sits centred above the prompt; the rest wait just below or above the stage.
  const PROMPT_SPACE = 64;
  let geo = { stageH: 0, cardH: 0, top: 0 };

  function measure() {
    const w = stage.clientWidth, h = stage.clientHeight;
    const headH = document.querySelector(".bar").offsetHeight + 16;
    const cardW = Math.max(200, Math.min(290, w * 0.74, (h - headH - PROMPT_SPACE - 8) / 1.58));
    stage.style.setProperty("--card-w", cardW + "px");
    const cardH = cardW * 1.58;
    geo = { stageH: h, cardH, top: Math.max(headH, (h - PROMPT_SPACE - cardH) / 2 + 12) };
  }

  // A dot grid hidden on the whole badge, revealed in a small soft circle around the pointer.
  // A few dots twinkle brighter. Mouse and trackpad only.
  const dots = (() => {
    const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const canvas = el("canvas", "dots");
    canvas.setAttribute("aria-hidden", "true");
    const ctx = canvas.getContext("2d");
    const GAP = 9, RADIUS = 58;
    let panel = null, mx = 0, my = 0, shown = 0, want = 0, frame = 0, tint = [0, 0, 0];

    const hash = (i, j) => {
      let h = Math.imul(i, 73856093) ^ Math.imul(j, 19349663);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    };

    function attach(p) {
      panel = p;
      // the twinkling dots borrow the backdrop colour of this post
      const hex = getComputedStyle(p).getPropertyValue("--accent").trim().replace("#", "");
      tint = hex.length === 6 ? [0, 2, 4].map(k => parseInt(hex.slice(k, k + 2), 16)) : [120, 120, 120];
      p.prepend(canvas);
      const dpr = Math.min(2, devicePixelRatio || 1);
      canvas.width = Math.round(p.clientWidth * dpr);
      canvas.height = Math.round(p.clientHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function draw(t) {
      shown += (want - shown) * 0.12;
      const w = panel.clientWidth, h = panel.clientHeight;
      ctx.clearRect(0, 0, w, h);
      if (shown > 0.01) {
        const r = RADIUS * (0.6 + 0.4 * shown);
        const i0 = Math.max(0, Math.floor((mx - r) / GAP)), i1 = Math.ceil((mx + r) / GAP);
        const j0 = Math.max(0, Math.floor((my - r) / GAP)), j1 = Math.ceil((my + r) / GAP);
        for (let i = i0; i <= i1; i++) {
          for (let j = j0; j <= j1; j++) {
            const x = GAP / 2 + i * GAP, y = GAP / 2 + j * GAP;
            if (x > w || y > h) continue;
            const f = 1 - Math.hypot(x - mx, y - my) / r;
            if (f <= 0) continue;
            const fall = f * f * shown;
            const hv = hash(i, j);
            const twinkle = still ? 0.5 : 0.5 + 0.5 * Math.sin(t * 0.004 * (0.6 + hv * 1.6) + hv * 50);
            const bright = hv > 0.86;
            ctx.fillStyle = bright
              ? `rgba(${tint[0]}, ${tint[1]}, ${tint[2]}, ${(0.3 + 0.5 * twinkle) * fall})`
              : `rgba(18, 20, 23, ${0.16 * fall})`;
            ctx.beginPath();
            ctx.arc(x, y, bright ? 2.1 : 1.7, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
      frame = shown > 0.01 || want > 0 ? requestAnimationFrame(draw) : 0;
    }

    if (fine) {
      stage.addEventListener("pointermove", e => {
        const p = slots[current].querySelector(".badge");
        if (p !== panel) attach(p);
        const r = p.getBoundingClientRect();
        // map through the badge tilt by scaling to the badge's untilted size
        mx = (e.clientX - r.left) * (p.clientWidth / r.width);
        my = (e.clientY - r.top) * (p.clientHeight / r.height);
        want = mx > 0 && my > 0 && mx < p.clientWidth && my < p.clientHeight ? 1 : 0;
        if (!frame) frame = requestAnimationFrame(draw);
      });
      stage.addEventListener("pointerleave", () => { want = 0; });
    }

    return {
      reset() {
        cancelAnimationFrame(frame);
        frame = 0;
        want = shown = 0;
        canvas.remove();
        panel = null;
      },
    };
  })();

  // ---------- badges follow the scroll position ----------
  // pos is a position in badges: at a whole number that badge sits in the middle. Between two,
  // the earlier badge is part-way up off the top and the later one part-way up from below.
  const last = posts.length - 1;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const instant = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let current = 0;          // the settled badge
  let pos = 0;              // where the stack is drawn
  let target = 0;           // where the scroll wants it
  let frame = 0;

  function layout() {
    const above = -geo.cardH - 220;      // far enough that its shadow leaves the screen too
    const below = geo.stageH + 40;
    slots.forEach((slot, k) => {
      const d = clamp(k - pos, -1, 1);   // -1 gone above, 0 in the middle, 1 waiting below
      const y = d < 0 ? geo.top + d * (geo.top - above) : geo.top + d * (below - geo.top);
      slot.style.transform = `translate(-50%, ${y}px) rotate(${4 * d}deg)`;
      slot.style.visibility = Math.abs(k - pos) >= 1 ? "hidden" : "visible";
      slot.style.pointerEvents = k === current ? "auto" : "none";
    });
  }

  function settle(n) {
    if (n === current) return;
    current = n;
    slots.forEach((slot, k) => {
      slot.setAttribute("aria-hidden", k === n ? "false" : "true");
      slot.querySelectorAll("a").forEach(a => (a.tabIndex = k === n ? 0 : -1));
    });
    hintEl.textContent = n === last ? "That's all of them · scroll back to revisit" : "Scroll up to see more";
    tilt.reset();
    dots.reset();
  }

  function tick() {
    pos = instant ? target : pos + (target - pos) * 0.14;
    if (Math.abs(target - pos) < 0.001) pos = target;
    showWall(clamp(Math.round(pos), 0, last));
    if (Number.isInteger(target) && Math.abs(target - pos) < 0.02) settle(target);
    layout();
    frame = pos !== target ? requestAnimationFrame(tick) : 0;
  }
  const kick = () => { if (!frame) frame = requestAnimationFrame(tick); };

  // After the scroll stops, snap to a badge: the next one in the direction of travel
  // unless the move was tiny.
  // One gesture moves at most one badge. `from` is the badge a gesture started on; once it has
  // snapped, the rest of that gesture (a trackpad's momentum tail) is ignored.
  let snapTimer = 0, dir = 0, from = 0, spent = false, snappedAt = -1e9;
  function snapSoon(delay) {
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => {
      const base = dir > 0 ? Math.floor(target) : Math.ceil(target);
      target = clamp(Math.abs(target - base) > 0.08 ? base + dir : base, 0, last);
      spent = true;
      snappedAt = performance.now();
      kick();
    }, delay);
  }
  function nudge(by) {
    if (!by) return;
    dir = Math.sign(by);
    target = clamp(target + by, Math.max(-0.3, from - 1), Math.min(last + 0.3, from + 1));
    kick();
  }

  const PX_PER_BADGE = 600;
  const GESTURE_GAP = 260;   // ms of quiet that ends a scroll gesture
  const COOLDOWN = 800;      // ms after a badge settles before a new gesture can start
  let lastWheel = 0;
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    const now = performance.now();
    const quiet = now - lastWheel;
    lastWheel = now;
    // A new gesture needs a pause in scrolling and the cooldown to have passed; anything else is
    // the tail of the last swipe (trackpads keep coasting, sometimes with small gaps).
    if (quiet > GESTURE_GAP && now - snappedAt > COOLDOWN) { from = Math.round(target); spent = false; }
    if (spent) return;
    const unit = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? stage.clientHeight : 1;
    const delta = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * unit;
    nudge(delta / PX_PER_BADGE);
    snapSoon(140);
  }, { passive: false });

  // Touch: the badge follows the finger; drag up for the next one.
  let touch = null;
  stage.addEventListener("touchstart", e => {
    clearTimeout(snapTimer);
    touch = { x: e.touches[0].clientX, y: e.touches[0].clientY, from: target };
  }, { passive: true });
  stage.addEventListener("touchmove", e => {
    if (!touch) return;
    const dy = e.touches[0].clientY - touch.y;
    const start = Math.round(touch.from);
    const next = clamp(touch.from - dy / (stage.clientHeight * 0.6), Math.max(-0.3, start - 1), Math.min(last + 0.3, start + 1));
    dir = Math.sign(next - target) || dir;
    target = next;
    kick();
  }, { passive: true });
  stage.addEventListener("touchend", () => {
    if (!touch) return;
    touch = null;
    snapSoon(0);
  }, { passive: true });

  document.addEventListener("keydown", e => {
    let step = 0;
    if (["ArrowDown", "ArrowRight", "PageDown", " "].includes(e.key)) step = 1;
    if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) step = -1;
    if (!step) return;
    e.preventDefault();
    clearTimeout(snapTimer);
    dir = step;
    target = clamp(Math.round(target) + step, 0, last);
    kick();
  });

  addEventListener("resize", () => {
    showWall(Math.round(pos), true);
    measure();
    layout();
  });
  measure();
  current = -1;
  settle(0);
  layout();
  showWall(0);
  stage.focus({ preventScroll: true });
})();
</script>
</body>
</html>
