name: Scrape Config India posts

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Searches, separated by ; (leave empty for the built-in Config India searches)"
        required: false
        default: ""
      since:
        description: "From date, YYYY-MM-DD"
        required: false
        default: "2026-10-08"
      until:
        description: "Up to date (exclusive), YYYY-MM-DD, optional"
        required: false
        default: ""
      limit:
        description: "Max posts per search"
        required: false
        default: "500"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      X_USERNAME: ${{ secrets.X_USERNAME }}
      X_COOKIES: ${{ secrets.X_COOKIES }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect posts from X
        env:
          QUERIES: ${{ inputs.queries }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ -z "$X_USERNAME" ] || [ -z "$X_COOKIES" ]; then
            echo "::error::Add the X_USERNAME and X_COOKIES secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          args=(--since "$SINCE" --limit "$LIMIT")
          [ -n "$UNTIL" ] && args+=(--until "$UNTIL")
          IFS=';' read -ra parts <<< "$QUERIES"
          for q in "${parts[@]}"; do
            q="${q#"${q%%[![:space:]]*}"}"; q="${q%"${q##*[![:space:]]}"}"
            [ -n "$q" ] && args+=(-q "$q")
          done
          python collect.py "${args[@]}"

      - name: Find critical posts with Claude
        if: env.ANTHROPIC_API_KEY != ''
        run: python classify.py

      - name: Write results to this page
        if: always()
        run: python summarize.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-india-results
          path: data/*.csv
          if-no-files-found: ignore
